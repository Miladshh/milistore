<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>میلی‌استور | پوشاک زنانه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFEDE7;
    --ink:#23211E;
    --taupe:#8A7F6B;
    --olive:#48513F;
    --rose:#C9A9A6;
    --card:#F8F7F4;
    --line:#DAD6CC;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Vazirmatn', sans-serif;
    line-height:1.7;
  }
  h1,h2,h3,.serif{
    font-family:'Noto Naskh Arabic', serif;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  img{display:block;max-width:100%;}

  /* Header */
  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 6vw;
    background:rgba(239,237,231,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .logo{font-size:1.5rem; font-weight:600; letter-spacing:0.5px;}
  .cart-btn{
    display:flex; align-items:center; gap:8px;
    padding:9px 18px;
    border:1px solid var(--ink);
    border-radius:2px;
    font-size:0.9rem;
    transition:background .2s, color .2s;
  }
  .cart-btn:hover{background:var(--ink); color:var(--bg);}
  .cart-count{
    background:var(--olive); color:#fff;
    border-radius:50%; width:20px; height:20px;
    display:flex; align-items:center; justify-content:center;
    font-size:0.72rem;
  }

  /* Hero */
  .hero{
    padding:9vh 6vw 8vh;
    display:grid; grid-template-columns:1.1fr 0.9fr; gap:40px;
    align-items:center;
    border-bottom:1px solid var(--line);
  }
  .hero .eyebrow{
    color:var(--taupe); letter-spacing:3px; font-size:0.78rem; text-transform:uppercase;
    margin-bottom:18px; display:block;
  }
  .hero h1{
    font-size:clamp(2.1rem, 4.2vw, 3.4rem);
    font-weight:600; line-height:1.35;
    margin-bottom:22px;
  }
  .hero p{
    color:#4a463f; max-width:440px; margin-bottom:32px; font-size:1.02rem;
  }
  .btn-primary{
    display:inline-block; padding:14px 34px;
    background:var(--ink); color:var(--bg);
    border-radius:2px; font-size:0.95rem; letter-spacing:0.4px;
    transition:opacity .2s;
  }
  .btn-primary:hover{opacity:0.82;}
  .hero-visual{
    aspect-ratio:4/5; overflow:hidden; border-radius:2px;
    position:relative;
  }
  .hero-visual img{width:100%; height:100%; object-fit:cover;}
  .hero-visual::after{
    content:"٠١ / کلکسیون تازه";
    position:absolute; bottom:16px; right:16px;
    background:rgba(35,33,30,0.78); color:#fff;
    padding:8px 14px; font-size:0.75rem; border-radius:2px; letter-spacing:0.5px;
  }

  /* Category tabs */
  .tabs{
    display:flex; gap:10px; flex-wrap:wrap;
    padding:40px 6vw 0;
  }
  .tab{
    padding:9px 20px; border:1px solid var(--line); border-radius:20px;
    font-size:0.88rem; color:#5a564d;
    transition:all .2s;
  }
  .tab.active, .tab:hover{
    background:var(--ink); color:var(--bg); border-color:var(--ink);
  }

  /* Products */
  .products{
    padding:34px 6vw 10vh;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:28px;
  }
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:2px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .card-img{
    aspect-ratio:3/4; overflow:hidden; position:relative; background:#e4e1d8;
  }
  .card-img img{width:100%; height:100%; object-fit:cover; transition:transform .4s;}
  .card:hover .card-img img{transform:scale(1.05);}
  .tag-num{
    position:absolute; top:10px; left:10px;
    background:#fff; color:var(--ink);
    font-size:0.7rem; padding:4px 9px; border-radius:2px;
    font-weight:600; letter-spacing:0.5px;
  }
  .card-body{padding:16px 16px 18px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card-cat{color:var(--taupe); font-size:0.72rem; letter-spacing:1px;}
  .card-name{font-weight:600; font-size:1rem;}
  .card-price{font-size:0.92rem; color:#4a463f; margin-top:auto; padding-top:8px;}
  .add-btn{
    margin-top:10px; padding:10px; border:1px solid var(--ink);
    font-size:0.85rem; border-radius:2px; transition:all .2s;
  }
  .add-btn:hover{background:var(--olive); border-color:var(--olive); color:#fff;}

  /* Cart drawer */
  .overlay{
    position:fixed; inset:0; background:rgba(35,33,30,0.4);
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:60;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; bottom:0; left:0; width:min(380px, 90vw);
    background:var(--bg); z-index:70;
    transform:translateX(-100%); transition:transform .3s ease;
    display:flex; flex-direction:column;
    box-shadow:8px 0 24px rgba(0,0,0,0.12);
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    padding:20px; border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center;
  }
  .drawer-head h3{font-size:1.2rem;}
  .close-btn{font-size:1.3rem; color:var(--taupe);}
  .drawer-items{flex:1; overflow-y:auto; padding:12px 20px;}
  .drawer-item{
    display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);
  }
  .drawer-item img{width:60px; height:76px; object-fit:cover; border-radius:2px;}
  .di-info{flex:1;}
  .di-name{font-size:0.92rem; font-weight:500;}
  .di-cat{font-size:0.72rem; color:var(--taupe);}
  .di-controls{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .qty-btn{
    width:24px; height:24px; border:1px solid var(--line); border-radius:50%;
    font-size:0.9rem; display:flex; align-items:center; justify-content:center;
  }
  .di-remove{font-size:0.75rem; color:#a15c4f; margin-right:auto;}
  .drawer-foot{padding:20px; border-top:1px solid var(--line);}
  .drawer-total{display:flex; justify-content:space-between; margin-bottom:16px; font-weight:600;}
  .checkout-btn{
    width:100%; padding:14px; background:#229ED9; color:#fff;
    border-radius:2px; font-size:0.95rem; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .checkout-btn:hover{opacity:0.9;}
  .empty-cart{color:var(--taupe); font-size:0.9rem; text-align:center; padding:40px 0;}

  footer{
    padding:40px 6vw; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;
    font-size:0.85rem; color:#5a564d;
  }
  footer a{color:var(--olive);}

  @media (max-width:760px){
    .hero{grid-template-columns:1fr; padding-top:6vh;}
    .hero-visual{order:-1;}
  }
</style>
</head>
<body>

<header>
  <div class="logo serif">میلی‌استور</div>
  <button class="cart-btn" onclick="openCart()">
    سبد خرید <span class="cart-count" id="cartCount">0</span>
  </button>
</header>

<section class="hero">
  <div>
    <span class="eyebrow">پوشاک زنانه</span>
    <h1>پوشاکی که<br>سلیقه‌ات را روایت می‌کند</h1>
    <p>گلچینی از پوشاک روزمره و اسپشیال با دوخت مینیمال. سفارش‌ها مستقیم و سریع از طریق تلگرام ثبت می‌شوند.</p>
    <a href="#products" class="btn-primary">مشاهده محصولات</a>
  </div>
  <div class="hero-visual">
    <img src="https://picsum.photos/seed/milistore-hero/700/875" alt="نمونه پوشاک">
  </div>
</section>

<div class="tabs" id="tabs"></div>

<section class="products" id="products"></section>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h3 class="serif">سبد خرید</h3>
    <button class="close-btn" onclick="closeCart()">✕</button>
  </div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-foot">
    <div class="drawer-total">
      <span>جمع کل</span>
      <span id="drawerTotal">۰ تومان</span>
    </div>
    <button class="checkout-btn" onclick="checkout()">✈ ثبت سفارش در تلگرام</button>
  </div>
</aside>

<footer>
  <div>© میلی‌استور — تمام حقوق محفوظ است</div>
  <div>سفارش و پشتیبانی: <a href="https://t.me/milistore.ir" target="_blank">t.me/milistore.ir@</a></div>
</footer>

<script>
  const TELEGRAM_USERNAME = "milistore.ir"; // بعداً اگه آیدی عوض شد، همین‌جا تغییرش بده

  const products = [
    {id:1, name:"مانتو لینن ساده", cat:"مانتو", price:890000, img:"https://picsum.photos/seed/mili1/500/650"},
    {id:2, name:"شومیز کتان یقه‌گرد", cat:"شومیز", price:520000, img:"https://picsum.photos/seed/mili2/500/650"},
    {id:3, name:"دامن پلیسه بلند", cat:"دامن", price:610000, img:"https://picsum.photos/seed/mili3/500/650"},
    {id:4, name:"مانتو تنکه راسته", cat:"مانتو", price:950000, img:"https://picsum.photos/seed/mili4/500/650"},
    {id:5, name:"روسری ابریشم طرح‌دار", cat:"اکسسوری", price:340000, img:"https://picsum.photos/seed/mili5/500/650"},
    {id:6, name:"شومیز آستین بلند", cat:"شومیز", price:480000, img:"https://picsum.photos/seed/mili6/500/650"},
    {id:7, name:"دامن کوتاه A-line", cat:"دامن", price:390000, img:"https://picsum.photos/seed/mili7/500/650"},
    {id:8, name:"کیف دستی چرم", cat:"اکسسوری", price:720000, img:"https://picsum.photos/seed/mili8/500/650"},
  ];

  const categories = ["همه", ...new Set(products.map(p => p.cat))];
  let activeCat = "همه";
  let cart = []; // { id, qty }

  function fa(n){ return n.toLocaleString('fa-IR'); }

  function renderTabs(){
    const el = document.getElementById('tabs');
    el.innerHTML = categories.map(c =>
      `<button class="tab ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>`
    ).join('');
  }

  function setCat(c){ activeCat = c; renderTabs(); renderProducts(); }

  function renderProducts(){
    const el = document.getElementById('products');
    const list = activeCat === "همه" ? products : products.filter(p => p.cat === activeCat);
    el.innerHTML = list.map((p, i) => `
      <div class="card">
        <div class="card-img">
          <span class="tag-num">${fa(String(i+1).padStart(2,'0'))}</span>
          <img src="${p.img}" alt="${p.name}">
        </div>
        <div class="card-body">
          <span class="card-cat">${p.cat}</span>
          <span class="card-name">${p.name}</span>
          <span class="card-price">${fa(p.price)} تومان</span>
          <button class="add-btn" onclick="addToCart(${p.id})">افزودن به سبد</button>
        </div>
      </div>
    `).join('');
  }

  function addToCart(id){
    const item = cart.find(i => i.id === id);
    if(item) item.qty++;
    else cart.push({id, qty:1});
    renderCart();
    openCart();
  }

  function changeQty(id, delta){
    const item = cart.find(i => i.id === id);
    if(!item) return;
    item.qty += delta;
    if(item.qty <= 0) cart = cart.filter(i => i.id !== id);
    renderCart();
  }

  function removeItem(id){
    cart = cart.filter(i => i.id !== id);
    renderCart();
  }

  function renderCart(){
    const count = cart.reduce((s,i) => s+i.qty, 0);
    document.getElementById('cartCount').textContent = fa(count);

    const el = document.getElementById('drawerItems');
    if(cart.length === 0){
      el.innerHTML = `<div class="empty-cart">سبد خریدت خالیه</div>`;
    } else {
      el.innerHTML = cart.map(ci => {
        const p = products.find(p => p.id === ci.id);
        return `
          <div class="drawer-item">
            <img src="${p.img}" alt="${p.name}">
            <div class="di-info">
              <div class="di-name">${p.name}</div>
              <div class="di-cat">${p.cat}</div>
              <div class="di-controls">
                <button class="qty-btn" onclick="changeQty(${p.id}, -1)">−</button>
                <span>${fa(ci.qty)}</span>
                <button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
                <button class="di-remove" onclick="removeItem(${p.id})">حذف</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    const total = cart.reduce((s,ci) => {
      const p = products.find(p => p.id === ci.id);
      return s + p.price * ci.qty;
    }, 0);
    document.getElementById('drawerTotal').textContent = fa(total) + ' تومان';
  }

  function openCart(){
    document.getElementById('drawer').classList.add('open');
    document.getElementById('overlay').classList.add('open');
  }
  function closeCart(){
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  }

  function checkout(){
    if(cart.length === 0){ alert('سبد خریدت خالیه'); return; }
    let msg = "سلام، می‌خوام سفارش بدم:%0A%0A";
    let total = 0;
    cart.forEach(ci => {
      const p = products.find(p => p.id === ci.id);
      msg += `- ${p.name} (${p.cat}) × ${ci.qty} = ${fa(p.price*ci.qty)} تومان%0A`;
      total += p.price * ci.qty;
    });
    msg += `%0Aجمع کل: ${fa(total)} تومان`;
    window.open(`https://t.me/${TELEGRAM_USERNAME}?text=${msg}`, '_blank');
  }

  renderTabs();
  renderProducts();
  renderCart();
</script>

</body>
</html>
